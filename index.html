
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fútbol 2 Jugadores</title>

<style>
body{
    margin:0;
    background:#1b1b1b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

canvas{
    background:#2E8B57;
    border:5px solid white;
}

#info{
    position:absolute;
    top:15px;
    color:white;
    font-family:Arial;
    font-size:24px;
    font-weight:bold;
}
</style>

</head>

<body>

<div id="info">
Azul 0 - 0 Rojo | Tiempo: <span id="time">90</span>
</div>

<canvas id="game" width="1000" height="600"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let scoreBlue=0;
let scoreRed=0;
let time=90;

const keys={};

document.addEventListener("keydown",(e)=>{
keys[e.key]=true;
});

document.addEventListener("keyup",(e)=>{
keys[e.key]=false;
});

const player1={
x:150,
y:300,
r:20,
color:"blue",
speed:4
};

const player2={
x:850,
y:300,
r:20,
color:"red",
speed:4
};

const ball={
x:500,
y:300,
r:12,
vx:0,
vy:0
};

setInterval(()=>{
if(time>0){
time--;
document.getElementById("time").textContent=time;
}
},1000);

function resetBall(){
ball.x=500;
ball.y=300;
ball.vx=0;
ball.vy=0;
player1.x=150;
player1.y=300;
player2.x=850;
player2.y=300;
}

function drawField(){

ctx.fillStyle="#2E8B57";
ctx.fillRect(0,0,1000,600);

ctx.strokeStyle="white";
ctx.lineWidth=4;

ctx.strokeRect(0,0,1000,600);

ctx.beginPath();
ctx.arc(500,300,80,0,Math.PI*2);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(500,0);
ctx.lineTo(500,600);
ctx.stroke();

ctx.strokeRect(0,200,70,200);
ctx.strokeRect(930,200,70,200);

}

function drawPlayer(p){

ctx.beginPath();
ctx.fillStyle=p.color;
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();

}

function drawBall(){

ctx.beginPath();
ctx.fillStyle="white";
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fill();

}

function update(){

// Jugador azul
if(keys["w"]) player1.y-=player1.speed;
if(keys["s"]) player1.y+=player1.speed;
if(keys["a"]) player1.x-=player1.speed;
if(keys["d"]) player1.x+=player1.speed;

// Jugador rojo
if(keys["ArrowUp"]) player2.y-=player2.speed;
if(keys["ArrowDown"]) player2.y+=player2.speed;
if(keys["ArrowLeft"]) player2.x-=player2.speed;
if(keys["ArrowRight"]) player2.x+=player2.speed;
    // Limitar jugadores al campo
player1.x=Math.max(player1.r,Math.min(1000-player1.r,player1.x));
player1.y=Math.max(player1.r,Math.min(600-player1.r,player1.y));

player2.x=Math.max(player2.r,Math.min(1000-player2.r,player2.x));
player2.y=Math.max(player2.r,Math.min(600-player2.r,player2.y));

// Contacto con el balón
[player1,player2].forEach(p=>{

let dx=ball.x-p.x;
let dy=ball.y-p.y;
let dist=Math.sqrt(dx*dx+dy*dy);

if(dist<p.r+ball.r){

ball.x=p.x+(dx/dist)*(p.r+ball.r);
ball.y=p.y+(dy/dist)*(p.r+ball.r);

// Disparo
if((p===player1 && keys[" "])||(p===player2 && keys["Enter"])){

ball.vx=(dx/dist)*12;
ball.vy=(dy/dist)*12;

}else{

ball.vx+=(dx/dist)*0.8;
ball.vy+=(dy/dist)*0.8;

}

}

});

// Movimiento del balón
ball.x+=ball.vx;
ball.y+=ball.vy;

// Fricción
ball.vx*=0.98;
ball.vy*=0.98;

// Rebotes
if(ball.y<ball.r||ball.y>600-ball.r){
ball.vy*=-1;
}

if(ball.x<ball.r){
if(ball.y>200&&ball.y<400){

scoreRed++;
document.getElementById("info").innerHTML=
`Azul ${scoreBlue} - ${scoreRed} Rojo | Tiempo: <span id="time">${time}</span>`;

setTimeout(resetBall,1000);

}else{

ball.vx*=-1;

}
}

if(ball.x>1000-ball.r){

if(ball.y>200&&ball.y<400){

scoreBlue++;

document.getElementById("info").innerHTML=
`Azul ${scoreBlue} - ${scoreRed} Rojo | Tiempo: <span id="time">${time}</span>`;

setTimeout(resetBall,1000);

}else{

ball.vx*=-1;

}
}

}

function draw(){

drawField();
drawPlayer(player1);
drawPlayer(player2);
drawBall();

}

function game(){

update();
draw();
requestAnimationFrame(game);

}

game();

</script>
</body>
</html>
